  actividades_cientificas_otras:
  - _code: 070.010.000.000
    Description: "Mi trayectoria investigadora se centra en el análisis arquetípico\
      \ (AA), una técnica de aprendizaje no supervisado que representa los datos mediante\
      \ sus observaciones más extremas, ofreciendo ventajas en interpretabilidad y\
      \ rendimiento frente a alternativas basadas en tendencias centrales. Esta línea\
      \ se inició durante mi Trabajo de Fin de Máster en la Universitat Jaume I, bajo\
      \ la supervisión de la Prof. Irene Epifanio, y se consolidó con la tesis doctoral&#160;New\
      \ developments and applications of Archetypal Analysis, defendida en 2024 con\
      \ calificación de Sobresaliente Cum Laude, Mención Internacional (dos estancias\
      \ en la Technical University of Denmark) y Mención Industrial (cooperación con\
      \ The Blosc Development Team). \n<br/> \n<br/>La contribución teórica central\
      \ es el análisis de biarquetipos (BiAA), publicado en&#160;IEEE TPAMI&#160;(2024),\
      \ que extiende por primera vez el AA a la identificación simultánea de patrones\
      \ extremos en dos dimensiones de datos tensoriales (Cap. 7 de la tesis). La\
      \ tesis también incluye: detección de atípicos en datos funcionales agrupados\
      \ en clusters (PLOS ONE, 2024) (Cap. 6); clasificación de formas 3D de pies\
      \ mediante arquetipoides en colaboración con el Instituto de Biomecánica de\
      \ Valencia (PLOS ONE, 2020) (Cap. 3); sistemas de recomendación de talla de\
      \ calzado que integran medidas 3D con preferencias de usuario (Mathematics,\
      \ 2021) (Cap. 4); códecs de compresión para Blosc2 (Electronics Letters, 2026)\
      \ (Cap. 5); y el paquete Python&#160;archetypes, con más de 1500 descargas mensuales\
      \ en PyPI (Cap. 9). Todas las contribuciones van acompañadas de repositorios\
      \ de código abierto en Python y R que garantizan la reproducibilidad de los\
      \ resultados. De forma paralela a la línea de arquetipos, se desarrolló una\
      \ contribución en clasificación ordinal para datos en intervalos y datos funcionales\
      \ en intervalos (Expert Systems with Applications, 2024) (Cap. 10). \n<br/>\
      \ \n<br/>Actualmente, la línea se está expandiendo con: el primer survey exhaustivo\
      \ sobre AA junto a M. Mørup (DTU) y S. Mair (Linköping University), en segunda\
      \ revisión en&#160;IEEE TPAMI; AA con restricciones de equidad (en revisión\
      \ en&#160;Journal of Classification); escalamiento multidimensional usando AA\
      \ para datos asimétricos (en revisión en&#160;Econometrics and Statistics);\
      \ dos capítulos de libro en Springer; y la generalización de BiAA a tensores\
      \ de n dimensiones (Cap. 8). La dimensión multidisciplinar se refleja en colaboraciones\
      \ con el Instituto de Biomecánica de Valencia, The Blosc Development Team, la\
      \ DTU y la Universidad de Linköping, así como en la aplicación del AA en un\
      \ informe con el Ministerio de Igualdad (2026). Las estancias internacionales,\
      \ las presentaciones invitadas y la selección en la Young Statistician Showcase\
      \ (CEB-EIB 2019) reflejan la proyección internacional de la línea. \n<br/> \n\
      <br/>A medio y largo plazo, los objetivos incluyen profundizar en BiAA (datos\
      \ faltantes, funcionales, kernelización), ampliar el AA a nuevas estructuras\
      \ de datos (datos direccionales, formulaciones regularizadas), expandir el paquete&#160;archetypes&#160;y\
      \ publicar un libro en Springer. El objetivo general es establecer el AA como\
      \ herramienta de referencia para la exploración interpretable de datos.B.1.\
      \ Breve descripción del Trabajo de Fin de Grado (TFG) y puntuación obtenida\
      \ Respecto al desarrollo teórico del TFG, este se basa en describir algunas\
      \ de las técnicas matemáticas usadas en la compresión de imágenes. Por un lado,\
      \ se han descrito las transformaciones ortogonales y unitarias en dos dimensiones.\
      \ Además, nos hemos centrado en estudiar dos de ellas: la transformada discreta\
      \ de Fourier y la transformada discreta del coseno. Por otro lado, se han descrito\
      \ dos formas de cuantizar los datos: la cuantización escalar y la cuantización\
      \ vectorial. Finalmente, se han realizado diversos experimentos relacionados\
      \ con lo expuesto en el desarrollo teórico del TFG. En concreto, se representaron\
      \ gráficamente las funciones base de las dos transformaciones, también se implementaron\
      \ y aplicaron como ilustración en dos ejemplos y, para concluir, se implementó\
      \ la cuantización vectorial e ilustró con un ejemplo. \n<br/> \n<br/>Puntuación:\
      \ 9.60B.2. Breve descripción del Trabajo de Fin de Máster (TFM) y puntuación\
      \ obtenida En este trabajo se ha propuesto un nuevo concepto en estadística,\
      \ el análisis de biarquetipos o biAA, cuyo propósito es obtener arquetipos de\
      \ filas y columnas de una matriz de datos simultáneamente, es decir, extraer\
      \ arquetipos de individuos y variables a la vez. \n<br/>En primer lugar, se\
      \ ha definido el análisis de biarquetipos matemáticamente y se ha propuesto\
      \ un método numérico para resolverlo. A continuación, se ha implementado el\
      \ biAA en el lenguaje R y se ha construido un paquete de R que recoge esta implementación.\
      \ Además, se ha ilustrado este nuevo concepto con un ejemplo de juguete para\
      \ que se entendiera y se viera cómo utilizar el paquete creado. Por último,\
      \ se ha aplicado a un problema de análisis deportivo, donde el biAA ha permitido\
      \ descubrir patrones escondidos en los datos. En concreto, se ha aplicado a\
      \ un conjunto de datos que contiene métricas de los jugadores de la NBA. \n\
      <br/>Este trabajo sienta la bases de lo que será mi Tesis Doctoral. \n<br/>\
      \ \n<br/> \n<br/>Puntuación: 10.00"
